[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "earmark"
version = "0.1.0"
description = "Spoiler-safe listening companion and conversational discovery for audiobooks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jaya Chandra Dadi" }]
dependencies = [
    "numpy>=1.26",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Speech-to-text for audio alignment (CTranslate2 Whisper, runs on CPU / Apple Silicon).
asr = ["faster-whisper>=1.1"]
# ONNX sentence embeddings for dense retrieval (BAAI/bge-small-en-v1.5).
embed = ["fastembed>=0.5"]
# Model Context Protocol server so assistants can call the companion as tools.
mcp = ["mcp>=2.0"]
all = ["earmark[asr,embed,mcp]"]
dev = ["earmark[all]", "pytest>=8", "ruff>=0.6"]

[project.scripts]
earmark = "earmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/earmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905", "SIM113"]
